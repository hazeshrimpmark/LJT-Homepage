name: Check live site

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check published GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          sleep 20
          check() {
            local url="$1"
            local term="$2"
            local out="/tmp/page-${3}.html"
            local code
            code=$(curl -L -sS --retry 4 --retry-delay 5 --retry-all-errors -o "$out" -w '%{http_code}' "$url")
            echo "$url -> HTTP $code"
            test "$code" = "200"
            grep -q "$term" "$out"
          }
          check 'https://hazeshrimpmark.github.io/LJT-Homepage/' 'Junteng Liu' home
          check 'https://hazeshrimpmark.github.io/LJT-Homepage/publications/' 'SynLogic' publications
          check 'https://hazeshrimpmark.github.io/LJT-Homepage/cv/' 'SynLogic' cv
