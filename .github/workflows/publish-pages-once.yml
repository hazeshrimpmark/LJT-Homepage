name: One-time Pages publish

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl /LJT-Homepage
        env:
          JEKYLL_ENV: production
      - name: Publish built site to gh-pages branch
        id: publish
        shell: bash
        run: |
          set -u
          cd _site
          touch .nojekyll
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy LJT-Homepage to GitHub Pages'
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          set +e
          git push --force origin gh-pages
          push_status=$?
          set -e
          cd ..
          if [ "$push_status" -eq 0 ]; then
            echo 'Pushed gh-pages branch successfully.'
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || true
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/' || true
            gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          else
            echo 'Could not push gh-pages branch with the workflow token.'
          fi
          exit 0
